[project]
name = "english-quiz-backend"
version = "0.1.0"
description = "Production-grade FastAPI backend for English Quiz App with Argon2id and JWT RTR"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.124.0",
    "uvicorn[standard]>=0.38.0",
    "sqlmodel>=0.0.27",
    "psycopg2-binary>=2.9.11",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.20",
    "cryptography>=46.0.3",
    "email-validator>=2.3.0",
    "websockets>=15.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.1",
]
